<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="PetDeliveryCE - Tudo para o seu pet, entregue rápido! 🐾" />

    <!-- ── PWA: tema e cores ──────────────────────────────────────── -->
    <meta name="theme-color" content="#F7931E" />
    <meta name="background-color" content="#FFF8F2" />

    <!-- ── PWA: iOS (Safari não usa o manifest para tudo) ─────────── -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="PetDeliveryCE" />

    <!-- Ícones iOS — Safari lê estas tags (não o manifest) -->
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="/icons/icon-512.png" />

    <!-- ── PWA: Android / Chrome ─────────────────────────────────── -->
    <!-- O manifest.webmanifest é gerado automaticamente pelo vite-plugin-pwa -->
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Favicon padrão -->
    <link rel="icon" type="image/png" href="/icons/icon-192.png" />

    <!-- ── Open Graph (compartilhamento) ─────────────────────────── -->
    <meta property="og:title"       content="PetDeliveryCE 🐾" />
    <meta property="og:description" content="Tudo para o seu pet, entregue rápido!" />
    <meta property="og:image"       content="/icons/icon-512.png" />
    <meta property="og:type"        content="website" />

    <title>🐾 PetDeliveryCE</title>

    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: 'Nunito', 'Segoe UI', system-ui, sans-serif;
        background: #FFF8F2;
        -webkit-font-smoothing: antialiased;
        /* Respeita o notch do iPhone (safe area) */
        padding-top: env(safe-area-inset-top);
        padding-bottom: env(safe-area-inset-bottom);
      }
      #root { min-height: 100vh; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
